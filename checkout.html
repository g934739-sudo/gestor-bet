<title>Checkout · Grivo.bet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0c;
    --bg-2:#0f0f13;
    --surface:#14141a;
    --surface-2:#1a1a22;
    --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.14);
    --text:#f5f5f7;
    --muted:#8b8b95;
    --muted-2:#5a5a63;
    --accent:#FFCB1F;
    --accent-ink:#0a0a0c;
    --green:#00E676;
    --red:#FF3B5C;
    --blue:#5AB4FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    min-height:100vh;position:relative;
    background:
      radial-gradient(60% 50% at 80% 0%, rgba(255,203,31,0.06), transparent 60%),
      radial-gradient(50% 40% at 0% 30%, rgba(0,230,118,0.025), transparent 60%),
      var(--bg);
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 90%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 90%);
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:-0.01em}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ─── Top bar ─────────────────────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:50;
    border-bottom:1px solid var(--line);
    background:rgba(10,10,12,0.85);backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
  }
  .topbar-inner{
    max-width:1240px;margin:0 auto;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .logo{display:inline-flex;align-items:baseline;font-weight:800;font-size:22px;letter-spacing:-0.03em}
  .logo .dot{color:var(--accent)}
  .logo .ext{color:var(--muted);font-weight:400}
  .back-link{
    display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:500;
    padding:8px 12px;border-radius:9px;
    transition:color .15s ease, background .15s ease;
  }
  .back-link:hover{color:var(--text);background:rgba(255,255,255,0.04)}
  .topbar-right{display:flex;align-items:center;gap:18px}
  .live-counter{
    display:inline-flex;align-items:center;gap:10px;
    padding:7px 14px;border-radius:99px;
    background:rgba(0,230,118,0.06);border:1px solid rgba(0,230,118,0.2);
    font-size:12px;color:var(--muted);
  }
  .live-counter .pip{width:7px;height:7px;border-radius:99px;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s ease-in-out infinite}
  .live-counter b{color:var(--green);font-weight:700;font-feature-settings:'tnum'}
  .secure{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--muted);font-size:12px;font-family:"JetBrains Mono",monospace;letter-spacing:0.08em;text-transform:uppercase;
  }
  .secure svg{color:var(--green)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
  @media (max-width:720px){
    .secure span{display:none}
    .live-counter span:not(:first-child){display:none}
    .topbar-right{gap:10px}
  }

  /* ─── Layout ─────────────────────────────────────────────── */
  .wrap{max-width:1240px;margin:0 auto;padding:56px 28px 80px;position:relative;z-index:1}
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:42px;align-items:start}
  @media (max-width:980px){.grid{grid-template-columns:1fr;gap:24px}}

  /* ─── Page head ─────────────────────────────────────────── */
  .page-head{margin-bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;gap:36px;flex-wrap:wrap}
  .page-eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px;
  }
  .page-eyebrow .num{color:var(--accent);font-weight:500}
  .page-eyebrow .rule{width:36px;height:1px;background:linear-gradient(to right, var(--accent), transparent)}
  .page-head h1{
    margin:0;font-size:clamp(34px,4vw,52px);line-height:1.02;letter-spacing:-0.035em;font-weight:800;text-wrap:balance;
  }
  .page-head h1 .accent{
    background:linear-gradient(180deg, var(--accent) 0%, #FFA200 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-head p{color:var(--muted);font-size:16px;margin-top:14px;max-width:580px;line-height:1.55}
  .head-stats{
    display:flex;gap:24px;flex-shrink:0;
  }
  .head-stat{display:flex;flex-direction:column;gap:4px}
  .head-stat-v{font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1;font-feature-settings:'tnum'}
  .head-stat-v.green{color:var(--green)}
  .head-stat-l{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em}
  @media (max-width:720px){
    .head-stats{gap:18px}
    .head-stat-v{font-size:22px}
  }

  /* ─── Steps progress ─────────────────────────────────────── */
  .progress{
    display:flex;align-items:center;gap:8px;margin-bottom:32px;
    padding:14px 22px;border-radius:99px;
    background:linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    border:1px solid var(--line);
  }
  .progress-step{
    display:flex;align-items:center;gap:10px;
  }
  .progress-num{
    width:26px;height:26px;border-radius:99px;
    background:rgba(255,255,255,0.05);border:1px solid var(--line-2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
    flex-shrink:0;transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .progress-step.active .progress-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px rgba(255,203,31,0.15)}
  .progress-step.done .progress-num{background:rgba(0,230,118,0.18);border-color:rgba(0,230,118,0.5);color:var(--green)}
  .progress-step.done .progress-num::before{content:"✓"}
  .progress-step.done .progress-num span{display:none}
  .progress-lbl{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:-0.005em;white-space:nowrap}
  .progress-step.active .progress-lbl{color:var(--text)}
  .progress-step.done .progress-lbl{color:var(--green)}
  .progress-rail{flex:1;height:1px;background:var(--line-2);min-width:20px;position:relative;overflow:hidden}
  .progress-rail::after{
    content:"";position:absolute;inset:0;background:var(--accent);
    transform:scaleX(0);transform-origin:left;transition:transform .5s ease;
  }
  .progress-rail.done::after{transform:scaleX(1)}
  @media (max-width:580px){
    .progress{padding:12px 14px}
    .progress-lbl{display:none}
    .progress-rail{min-width:8px}
  }

  /* ─── Cards ─────────────────────────────────────────────── */
  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.005));
    border:1px solid var(--line);border-radius:20px;padding:32px;
    transition:border-color .3s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(to right, transparent, rgba(255,203,31,0.3), transparent);
    opacity:0;transition:opacity .3s ease;
  }
  .card.touched::before{opacity:1}
  .card + .card{margin-top:18px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
  .card-head h2{
    font-size:21px;font-weight:700;letter-spacing:-0.02em;margin:0;
    display:flex;align-items:center;gap:14px;
  }
  .card-num{
    width:32px;height:32px;border-radius:99px;background:rgba(255,203,31,0.12);color:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;
    border:1px solid rgba(255,203,31,0.3);flex-shrink:0;
    box-shadow:0 0 0 4px rgba(255,203,31,0.04);
  }
  .card-step-pill{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;
    padding:4px 10px;border-radius:99px;border:1px solid var(--line);
  }
  .card-sub{color:var(--muted);font-size:14px;margin:0 0 22px;padding-left:46px;line-height:1.5}
  @media (max-width:580px){
    .card{padding:22px 20px}
    .card-sub{padding-left:0;margin-top:8px}
  }

  /* ─── Form fields ─────────────────────────────────────── */
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-grid .full{grid-column:1 / -1}
  @media (max-width:580px){.field-grid{grid-template-columns:1fr}.field-grid .full{grid-column:1}}
  .field{display:flex;flex-direction:column;gap:7px;position:relative}
  .field label{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.16em;display:flex;justify-content:space-between;
  }
  .field label .check{color:var(--green);font-size:12px;opacity:0;transition:opacity .2s ease}
  .field.valid label .check{opacity:1}
  .field-wrap{position:relative}
  .field input, .field select{
    width:100%;padding:14px 16px;border-radius:12px;
    background:rgba(0,0,0,0.32);border:1px solid var(--line);color:var(--text);
    font-family:"Outfit",sans-serif;font-size:15px;font-weight:500;letter-spacing:-0.01em;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
    outline:none;appearance:none;-webkit-appearance:none;
  }
  .field input::placeholder{color:var(--muted-2);font-weight:400}
  .field input:hover, .field select:hover{border-color:var(--line-2)}
  .field input:focus, .field select:focus{
    border-color:var(--accent);background:rgba(255,203,31,0.04);
    box-shadow:0 0 0 4px rgba(255,203,31,0.12);
  }
  .field.error input{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,92,0.12)}
  .field.valid input{border-color:rgba(0,230,118,0.3)}
  .field-error{color:var(--red);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
  .field-icon{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;
  }

  /* ─── Payment method tabs ─────────────────────────────── */
  .pay-tabs{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;
  }
  @media (max-width:520px){.pay-tabs{grid-template-columns:1fr;gap:8px}}
  .pay-tab{
    display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;
    background:rgba(0,0,0,0.32);border:1px solid var(--line);
    cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1);text-align:left;
    color:var(--text);font-family:inherit;position:relative;overflow:hidden;
  }
  .pay-tab:hover{border-color:var(--line-2);background:rgba(255,255,255,0.025);transform:translateY(-1px)}
  .pay-tab.active{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(255,203,31,0.1), rgba(255,255,255,0.01));
    box-shadow:0 0 0 1px var(--accent), 0 12px 32px -10px rgba(255,203,31,0.4);
    transform:translateY(-2px);
  }
  .pay-tab.active::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(to right, transparent, var(--accent), transparent);
  }
  .pay-tab-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pay-tab-icon{
    width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.04);
    display:flex;align-items:center;justify-content:center;color:var(--text);
    border:1px solid var(--line);flex-shrink:0;transition:all .2s ease;
  }
  .pay-tab.active .pay-tab-icon{background:rgba(255,203,31,0.18);color:var(--accent);border-color:rgba(255,203,31,0.5)}
  .pay-tab-name{font-size:15px;font-weight:600;letter-spacing:-0.01em}
  .pay-tab-tag{
    font-family:"JetBrains Mono",monospace;font-size:9.5px;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;
  }
  .pay-tab.active .pay-tab-tag{color:var(--green)}
  .pay-tab-radio{
    width:18px;height:18px;border-radius:99px;border:1.5px solid var(--line-2);
    flex-shrink:0;position:relative;transition:all .2s ease;
  }
  .pay-tab.active .pay-tab-radio{border-color:var(--accent);background:var(--accent)}
  .pay-tab.active .pay-tab-radio::after{
    content:"";position:absolute;inset:4px;border-radius:99px;background:var(--accent-ink);
  }

  /* Pre-payment method info banner */
  .method-info{
    display:flex;align-items:flex-start;gap:14px;padding:18px 20px;border-radius:14px;
    background:linear-gradient(180deg, rgba(255,203,31,0.05), rgba(255,203,31,0.01));
    border:1px solid rgba(255,203,31,0.2);
  }
  .method-info.blue{background:linear-gradient(180deg, rgba(90,180,255,0.05), rgba(90,180,255,0.01));border-color:rgba(90,180,255,0.2)}
  .method-info-icon{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:rgba(255,203,31,0.12);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .method-info.blue .method-info-icon{background:rgba(90,180,255,0.12);color:var(--blue)}
  .method-info-body{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .method-info-body strong{font-size:14px;letter-spacing:-0.01em;color:var(--text)}
  .method-info-body span{font-size:13px;color:var(--muted);line-height:1.55}
  .bank-row{
    display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;
  }
  .bank-pill{
    padding:4px 10px;border-radius:99px;
    background:rgba(255,255,255,0.04);border:1px solid var(--line);
    font-size:11px;color:var(--muted);font-weight:500;
  }

  /* ─── Pix block (post-submit) ───────────────────────── */
  .pix-block{
    display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:flex-start;
    padding:24px;border-radius:16px;
    background:linear-gradient(180deg, rgba(0,0,0,0.36), rgba(0,0,0,0.18));
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .pix-block::before{
    content:"";position:absolute;inset:-1px;border-radius:16px;padding:1px;
    background:linear-gradient(135deg, rgba(255,203,31,0.3), transparent 30%, transparent 70%, rgba(0,230,118,0.2));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  @media (max-width:580px){.pix-block{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px}}
  .pix-qr-wrap{position:relative}
  .pix-qr{
    width:200px;height:200px;border-radius:14px;background:#fff;padding:12px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--line-2), 0 14px 40px -8px rgba(0,0,0,0.6), 0 0 30px -10px rgba(255,203,31,0.3);
    position:relative;
  }
  .pix-qr-corners{position:absolute;inset:0;pointer-events:none}
  .pix-qr-corners::before, .pix-qr-corners::after{
    content:"";position:absolute;width:20px;height:20px;border:2px solid var(--accent);
  }
  .pix-qr-corners::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  .pix-qr-corners::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
  .pix-info{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0}
  .pix-status{
    display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
    padding:7px 14px;border-radius:99px;
    background:rgba(255,203,31,0.1);border:1px solid rgba(255,203,31,0.3);
    color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;
  }
  .pix-status .dot{width:7px;height:7px;border-radius:99px;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
  .pix-status.confirmed{background:rgba(0,230,118,0.12);border-color:rgba(0,230,118,0.4);color:var(--green)}
  .pix-status.confirmed .dot{background:var(--green);animation:none}
  .pix-instruct{font-size:14px;color:var(--text);line-height:1.5}
  .pix-instruct strong{color:var(--accent);font-weight:600}
  .pix-copy{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:11px;
    transition:border-color .15s ease;
  }
  .pix-copy:hover{border-color:var(--line-2)}
  .pix-copy-text{
    flex:1;min-width:0;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pix-copy-btn{
    padding:8px 14px;border-radius:8px;border:1px solid var(--line-2);
    background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;cursor:pointer;
    transition:all .15s ease;flex-shrink:0;letter-spacing:0.02em;
  }
  .pix-copy-btn:hover{background:#FFD744}
  .pix-copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}
  .pix-timer-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:10px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);
  }
  .pix-timer-row .label{display:flex;align-items:center;gap:8px}
  .pix-timer-row .time{font-family:"JetBrains Mono",monospace;color:var(--text);font-weight:700;font-feature-settings:'tnum';font-size:15px}

  /* ─── Installments ─────────────────────────────────── */
  .installments{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;margin-top:8px}
  @media (max-width:580px){.installments{grid-template-columns:repeat(2,1fr)}}
  .install-opt{
    padding:12px 14px;border-radius:11px;background:rgba(0,0,0,0.32);border:1px solid var(--line);
    cursor:pointer;text-align:left;font-family:inherit;color:var(--text);
    display:flex;flex-direction:column;gap:3px;transition:all .15s ease;
  }
  .install-opt:hover{border-color:var(--line-2)}
  .install-opt.active{border-color:var(--accent);background:rgba(255,203,31,0.08);box-shadow:0 0 0 1px var(--accent)}
  .install-opt .n{font-size:13px;font-weight:600;letter-spacing:-0.01em}
  .install-opt .v{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-feature-settings:'tnum'}
  .install-opt.active .v{color:var(--accent)}

  /* ─── Card brand ─────────────────────────────────────── */
  .card-brand{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:6px;
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.08em;
    color:var(--muted);text-transform:uppercase;
    padding:5px 9px;border-radius:6px;background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    opacity:0;transition:opacity .25s ease;
  }
  .card-brand.show{opacity:1}

  /* ─── Submit ──────────────────────────────────────── */
  .submit-btn{
    width:100%;padding:20px 24px;margin-top:28px;border-radius:14px;border:none;cursor:pointer;
    font-family:"Outfit",sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.01em;
    background:var(--accent);color:var(--accent-ink);
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    transition:all .2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,203,31,0.55),
      0 16px 40px -10px rgba(255,203,31,0.6),
      inset 0 -2px 0 rgba(0,0,0,0.18);
  }
  .submit-btn::before{
    content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition:left .8s ease;
  }
  .submit-btn:hover{background:#FFD744;transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(255,203,31,0.7),0 22px 50px -10px rgba(255,203,31,0.75),inset 0 -2px 0 rgba(0,0,0,0.18)}
  .submit-btn:hover::before{left:120%}
  .submit-btn:active{transform:translateY(0)}
  .submit-btn:disabled{opacity:0.65;cursor:not-allowed;transform:none}
  .submit-btn .arr{transition:transform .2s ease}
  .submit-btn:hover .arr{transform:translateX(4px)}
  .submit-meta{
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    margin-top:18px;font-size:12px;color:var(--muted-2);text-align:center;line-height:1.6;
  }
  .submit-meta .dot{width:3px;height:3px;border-radius:99px;background:var(--muted-2)}

  /* ─── Right column — summary ───────────────────────── */
  .summary{position:sticky;top:96px;display:flex;flex-direction:column;gap:18px}
  @media (max-width:980px){.summary{position:static}.summary-mobile-first{order:-1}}
  .summary-card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008));
    border:1px solid var(--line);border-radius:22px;padding:28px;overflow:hidden;
  }
  .summary-card.featured{
    border-color:rgba(255,203,31,0.5);
    background:
      radial-gradient(80% 60% at 100% 0%, rgba(255,203,31,0.1), transparent 60%),
      linear-gradient(180deg, rgba(255,203,31,0.06), rgba(255,203,31,0.01) 30%, rgba(255,255,255,0.01));
    box-shadow:0 0 0 1px rgba(255,203,31,0.15), 0 40px 80px -30px rgba(255,203,31,0.22);
  }
  .summary-card .corner-tag{
    position:absolute;top:18px;right:18px;
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
    padding:5px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  }
  .summary-h{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.2em;margin-bottom:16px;
  }
  .summary-h .pip{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--accent);margin-right:8px;vertical-align:middle}

  .plan-display{
    margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line);
  }
  .plan-display h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.025em}
  .plan-display .savings{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    padding:5px 11px;border-radius:99px;
    background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.3);
    color:var(--green);font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:0.04em;
  }

  /* Plan picker */
  .plan-picker-label{
    font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted-2);
    text-transform:uppercase;letter-spacing:0.16em;margin-bottom:8px;
  }
  .plan-pick{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .plan-opt{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;border-radius:11px;
    background:rgba(0,0,0,0.3);border:1px solid var(--line);
    cursor:pointer;transition:all .2s ease;font-family:inherit;color:var(--text);width:100%;
    position:relative;
  }
  .plan-opt:hover{border-color:var(--line-2);background:rgba(0,0,0,0.4)}
  .plan-opt.active{border-color:var(--accent);background:rgba(255,203,31,0.07);box-shadow:0 0 0 1px var(--accent)}
  .plan-opt-left{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
  .plan-opt-name{font-size:14px;font-weight:600;letter-spacing:-0.01em}
  .plan-opt-sub{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace}
  .plan-opt-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .plan-opt-price{font-size:15px;font-weight:700;letter-spacing:-0.01em;font-feature-settings:'tnum'}
  .plan-opt-tag{font-size:9.5px;color:var(--green);font-family:"JetBrains Mono",monospace;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}

  .summary-line{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;color:var(--muted)}
  .summary-line.discount{color:var(--green);font-weight:500}
  .summary-line strong{color:var(--text);font-weight:500;font-feature-settings:'tnum'}
  .summary-total{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-top:18px;margin-top:10px;border-top:1px dashed var(--line-2);
  }
  .summary-total-label{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;letter-spacing:0.16em;text-transform:uppercase}
  .summary-total-sub{font-size:12px;color:var(--muted-2);margin-top:4px;font-family:"JetBrains Mono",monospace}
  .summary-total-val{font-size:36px;font-weight:800;letter-spacing:-0.04em;font-feature-settings:'tnum';line-height:1;
    background:linear-gradient(180deg,#fff,#aaa);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .summary-total-val .cur{font-size:14px;color:var(--muted);font-weight:500;-webkit-text-fill-color:var(--muted);margin-right:4px}
  .summary-feats{
    display:flex;flex-direction:column;gap:9px;margin-top:20px;list-style:none;padding:0;
  }
  .summary-feats li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--muted)}
  .summary-feats li::before{
    content:"";width:14px;height:14px;border-radius:99px;
    background:rgba(0,230,118,0.18);border:1px solid rgba(0,230,118,0.45);
    margin-top:3px;flex-shrink:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14'><path d='M3 7l3 3 5-6' stroke='%2300E676' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-size:contain;background-repeat:no-repeat;
  }

  /* Testimonial */
  .testimonial{
    display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));border:1px solid var(--line);
  }
  .testi-stars{display:flex;gap:2px;color:var(--accent)}
  .testi-quote{font-size:14px;line-height:1.6;color:var(--text);font-weight:500;font-style:italic}
  .testi-author{display:flex;align-items:center;gap:10px}
  .testi-avatar{
    width:36px;height:36px;border-radius:99px;
    background:linear-gradient(135deg, var(--accent), #FFA200);
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;letter-spacing:-0.02em;flex-shrink:0;
  }
  .testi-info{display:flex;flex-direction:column;gap:1px}
  .testi-info b{font-size:13px;font-weight:600;letter-spacing:-0.01em}
  .testi-info span{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;letter-spacing:0.04em}

  /* Trust block */
  .trust{
    display:flex;flex-direction:column;gap:14px;padding:20px 22px;border-radius:18px;
    background:rgba(0,0,0,0.32);border:1px solid var(--line);
  }
  .trust-row{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);line-height:1.4}
  .trust-row svg{color:var(--green);flex-shrink:0}
  .trust-row strong{color:var(--text);font-weight:600}

  /* ─── Success state ──────────────────────────────── */
  .success-wrap{
    max-width:680px;margin:0 auto;padding:48px 28px 60px;text-align:center;position:relative;
  }
  .success-burst{
    position:absolute;inset:-20% 0 0;height:60%;pointer-events:none;z-index:-1;
    background:radial-gradient(60% 80% at 50% 50%, rgba(0,230,118,0.15), transparent 60%);
    filter:blur(8px);
  }
  .success-icon{
    width:96px;height:96px;border-radius:99px;
    background:radial-gradient(circle, rgba(0,230,118,0.35), rgba(0,230,118,0.05));
    border:1.5px solid rgba(0,230,118,0.5);
    display:inline-flex;align-items:center;justify-content:center;
    margin-bottom:28px;color:var(--green);
    box-shadow:0 0 60px -10px rgba(0,230,118,0.4), 0 0 0 8px rgba(0,230,118,0.06);
    animation:successPop .7s cubic-bezier(.2,1.6,.4,1) backwards;
  }
  .success-icon svg{animation:successCheck .5s ease .35s backwards}
  @keyframes successPop{
    0%{transform:scale(0) rotate(-20deg);opacity:0}
    60%{transform:scale(1.1) rotate(0);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  @keyframes successCheck{from{stroke-dashoffset:50;opacity:0}to{stroke-dashoffset:0;opacity:1}}
  .success-eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    padding:6px 14px;border-radius:99px;background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);
    color:var(--green);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;
    margin-bottom:18px;
  }
  .success-wrap h2{font-size:clamp(32px,4vw,46px);font-weight:800;letter-spacing:-0.035em;margin:0 0 14px;line-height:1.05}
  .success-wrap h2 .accent{
    background:linear-gradient(180deg, var(--accent), #FFA200);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .success-wrap > p{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto 32px;line-height:1.6}
  .success-wrap > p strong{color:var(--text)}
  .success-receipt{
    margin:32px auto 0;max-width:480px;padding:24px;border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.005));border:1px solid var(--line);
    display:flex;flex-direction:column;gap:12px;text-align:left;
  }
  .success-receipt-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .success-receipt-row strong{color:var(--text);font-weight:600;font-family:"JetBrains Mono",monospace;font-feature-settings:'tnum';letter-spacing:0.02em}
  .success-receipt-row:last-child{padding-top:10px;border-top:1px dashed var(--line-2);font-size:15px}

  .success-next{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px;
  }
  @media (max-width:580px){.success-next{grid-template-columns:1fr}}
  .success-btn{
    padding:16px 22px;border-radius:14px;font-size:15px;font-weight:700;letter-spacing:-0.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 0 0 1px rgba(255,203,31,0.5),0 12px 32px -8px rgba(255,203,31,0.55);
    transition:all .15s ease;
  }
  .success-btn:hover{background:#FFD744;transform:translateY(-1px)}
  .success-btn.ghost{
    background:transparent;color:var(--text);border:1px solid var(--line-2);box-shadow:none;
  }
  .success-btn.ghost:hover{border-color:var(--text);background:rgba(255,255,255,0.04)}

  /* ─── Mobile ──────────────────────────────────────── */
  @media (max-width:580px){
    .wrap{padding:32px 18px 60px}
    .topbar-inner{padding:14px 18px}
    .back-link span{display:none}
    .summary-total-val{font-size:28px}
    .page-head h1{font-size:30px}
    .pix-qr{width:170px;height:170px}
    .page-head{flex-direction:column;align-items:flex-start;gap:24px}
  }

  /* Animations */
  .fade-in{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .scale-in{animation:scaleIn .4s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
</style>
</head>
